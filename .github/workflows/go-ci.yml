name: Go CI

on:
  workflow_call:
    inputs:
      ref:
        description: Exact Git revision to validate
        required: false
        type: string
        default: ""
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vgxness_test
          POSTGRES_PASSWORD: vgxness_test
          POSTGRES_DB: vgxness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vgxness_test -d vgxness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Prefetch modules
        run: go mod download
      - name: Test with coverage
        env:
          VGXNESS_TEST_POSTGRES_DSN: postgresql://vgxness_test:vgxness_test@localhost:5432/vgxness_test?sslmode=disable
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce aggregate coverage floor
        run: |
          observed="$(go tool cover -func=coverage.out | awk '/^total:/{gsub("%", "", $3); print $3}')"
          required=70.0
          awk -v observed="$observed" -v required="$required" 'BEGIN {
            if (observed == "" || observed + 0 < required + 0) {
              printf "Coverage floor failed: observed %s%%, required %.1f%%\n", observed, required
              exit 1
            }
            printf "Coverage floor passed: observed %s%%, required %.1f%%\n", observed, required
          }'
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: warn

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vgxness_test
          POSTGRES_PASSWORD: vgxness_test
          POSTGRES_DB: vgxness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vgxness_test -d vgxness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VGXNESS_TEST_POSTGRES_DSN: postgresql://vgxness_test:vgxness_test@localhost:5432/vgxness_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Prefetch modules
        run: go mod download
      - name: Require PostgreSQL DSN
        run: test -n "${VGXNESS_TEST_POSTGRES_DSN:-}"
      - name: Run PostgreSQL integration tests
        run: |
          set -o pipefail
          go test -json -count=1 ./internal/syncpg ./cmd/vgxness-syncd | tee postgres-test.json
          if awk 'index($0, "\"Action\":\"skip\"") { found=1 } END { exit !found }' postgres-test.json; then
            printf 'PostgreSQL test output contains a skipped test or package\n' >&2
            exit 1
          fi
      - name: Upload PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-test-json
          path: postgres-test.json
          if-no-files-found: warn

  race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Prefetch modules
        run: go mod download
      - name: Race
        run: go test -count=1 -race ./...

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Vet e2e tests
        run: go vet -tags=e2e ./internal/e2e
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Tidy
        run: go mod tidy -diff
      - name: Whitespace
        run: git diff --check
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build -trimpath ./...

  vulnerability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  linux-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Prefetch modules
        run: go mod download
      - name: Deployment package contracts and foundation checks
        run: go test -tags=e2e -count=1 ./internal/e2e

  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install the pinned Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.287
      - name: Validate marketplace and plugin manifests
        run: |
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate plugins/vgxness --strict
      - name: Build vgxness for the hook and MCP smoke
        run: |
          go build -trimpath -o "$RUNNER_TEMP/bin/vgxness" ./cmd/vgxness
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Hook adapter and MCP server answer like Claude Code expects
        run: |
          set -euo pipefail
          project="$(mktemp -d)"
          context="$(printf '{"session_id":"ci","cwd":"%s","hook_event_name":"SessionStart","source":"startup"}' "$project" \
            | CLAUDE_PROJECT_DIR="$project" vgxness claude-code hook session-start --policy plugins/vgxness/policy/manager.md)"
          printf '%s' "$context" | jq -e '.hookSpecificOutput.hookEventName == "SessionStart" and (.hookSpecificOutput.additionalContext | length) > 1000' > /dev/null
          # Keep stdin open like Claude Code does: closing it right after the
          # request ends the session before the server answers.
          { printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}\n'; sleep 3; } \
            | CLAUDE_PROJECT_DIR="$project" vgxness mcp --full --workspace "$project" > initialize.jsonl
          head -n 1 initialize.jsonl | jq -e '.result.instructions | length > 100' > /dev/null
      - name: Headless plugin load smoke (needs ANTHROPIC_API_KEY)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            printf 'ANTHROPIC_API_KEY is not configured; skipping the headless smoke\n'
            exit 0
          fi
          project="$(mktemp -d)"
          cd "$project" && git init -q
          claude --bare -p --plugin-dir "$GITHUB_WORKSPACE/plugins/vgxness" --output-format stream-json --verbose --max-turns 1 "Reply with the single word ready." > stream.jsonl
          jq -e 'select(.type == "system" and .subtype == "init")
            | (.plugins | map(select(.name == "vgxness")) | length) == 1
              and ((.plugin_errors // []) | length) == 0
              and (.mcp_servers | map(select(.name == "plugin:vgxness:memory" and .status == "connected")) | length) == 1
              and (.agents | index("vgxness:explore")) != null' stream.jsonl > /dev/null

  windows-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Cross-build Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath ./...
          GOOS=windows GOARCH=arm64 go build -trimpath ./...
      - name: Compile and link Windows tests
        run: |
          GOOS=windows GOARCH=amd64 go test -count=1 -run '^$' -exec=/usr/bin/true ./...
          GOOS=windows GOARCH=amd64 go test -tags=e2e -count=1 -run '^$' -exec=/usr/bin/true ./internal/e2e

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Prefetch modules
        run: go mod download
      - name: Stress concurrent fresh memory opens
        run: go test -count=25 -v -run '^TestOpen_ConcurrentFreshProcesses$' ./internal/memory
      - name: Native tests
        run: go test -count=1 ./...

  darwin-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Prefetch modules
        run: go mod download
      - name: Build and smoke native CLI
        run: |
          go build -trimpath -o vgxness ./cmd/vgxness
          ./vgxness version
      - name: Test native filesystem packages
        run: go test -count=1 ./internal/config ./internal/memory ./internal/cli

  quality:
    name: quality
    if: ${{ always() }}
    needs: [coverage, postgres-integration, race, static, vulnerability, linux-e2e, plugin, windows-compile, windows-native, darwin-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every standard lane
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          POSTGRES_INTEGRATION_RESULT: ${{ needs.postgres-integration.result }}
          RACE_RESULT: ${{ needs.race.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          VULNERABILITY_RESULT: ${{ needs.vulnerability.result }}
          LINUX_E2E_RESULT: ${{ needs.linux-e2e.result }}
          PLUGIN_RESULT: ${{ needs.plugin.result }}
          WINDOWS_COMPILE_RESULT: ${{ needs.windows-compile.result }}
          WINDOWS_NATIVE_RESULT: ${{ needs.windows-native.result }}
          DARWIN_SMOKE_RESULT: ${{ needs.darwin-smoke.result }}
        run: |
          require_success() {
            lane="$1"
            result="$2"
            if [ "$result" != success ]; then
              printf '%s lane result: %s\n' "$lane" "$result" >&2
              exit 1
            fi
          }
          require_success coverage "$COVERAGE_RESULT"
          require_success postgres-integration "$POSTGRES_INTEGRATION_RESULT"
          require_success race "$RACE_RESULT"
          require_success static "$STATIC_RESULT"
          require_success vulnerability "$VULNERABILITY_RESULT"
          require_success linux-e2e "$LINUX_E2E_RESULT"
          require_success plugin "$PLUGIN_RESULT"
          require_success windows-compile "$WINDOWS_COMPILE_RESULT"
          require_success windows-native "$WINDOWS_NATIVE_RESULT"
          require_success darwin-smoke "$DARWIN_SMOKE_RESULT"
