name: Go CI

on:
  workflow_call:
    inputs:
      ref:
        description: Exact Git revision to validate
        required: false
        type: string
        default: ""
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.3
          cache: true
      - name: Prefetch modules
        run: go mod download
      - name: Test with coverage
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: warn

  race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.3
          cache: true
      - name: Prefetch modules
        run: go mod download
      - name: Race
        run: go test -count=1 -race ./...

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.3
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Tidy
        run: go mod tidy -diff
      - name: Whitespace
        run: git diff --check
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build -trimpath ./...

  linux-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.3
          cache: true
      - name: Prefetch modules
        run: go mod download
      - name: Hermetic clean-checkout E2E
        run: go test -tags=e2e -count=1 -run '^TestCleanCheckoutSetupAndNativeSDD$' ./internal/e2e

  windows-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.3
          cache: true
      - name: Cross-build Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath ./...
          GOOS=windows GOARCH=arm64 go build -trimpath ./...
      - name: Compile and link Windows tests
        run: |
          GOOS=windows GOARCH=amd64 go test -count=1 -run '^$' -exec=/usr/bin/true ./...
          GOOS=windows GOARCH=amd64 go test -tags=e2e -count=1 -run '^$' -exec=/usr/bin/true ./internal/e2e

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.3
          cache: true
      - name: Prefetch modules
        run: go mod download
      - name: Installer tests
        run: go test -count=1 ./internal/launcher ./internal/selfinstall ./internal/setup ./internal/cli
      - name: Native Windows self-install lifecycle
        run: go test -tags=e2e -count=1 -run '^TestWindowsSelfInstallLifecycle$' ./internal/e2e

  quality:
    name: quality
    if: ${{ always() }}
    needs: [coverage, race, static, linux-e2e, windows-compile, windows-install]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every standard lane
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RACE_RESULT: ${{ needs.race.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          LINUX_E2E_RESULT: ${{ needs.linux-e2e.result }}
          WINDOWS_COMPILE_RESULT: ${{ needs.windows-compile.result }}
          WINDOWS_INSTALL_RESULT: ${{ needs.windows-install.result }}
        run: |
          for result in "$COVERAGE_RESULT" "$RACE_RESULT" "$STATIC_RESULT" "$LINUX_E2E_RESULT" "$WINDOWS_COMPILE_RESULT" "$WINDOWS_INSTALL_RESULT"; do
            test "$result" = success || exit 1
          done
